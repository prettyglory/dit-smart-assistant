name: Live Agent Validation

on:
  push:
    branches:
      - feat/agentic-rag
    paths:
      - .github/workflows/live-agent-validation.yml

jobs:
  live-validation:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check live validation secret
        id: preflight
        shell: bash
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Live validation skipped::GROQ_API_KEY repository secret is not configured."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "GROQ_API_KEY is available for live validation."
          fi

      - name: Install backend dependencies
        if: steps.preflight.outputs.available == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Build DIT ChromaDB knowledge base
        if: steps.preflight.outputs.available == 'true'
        working-directory: backend
        run: python -m scripts.ingest

      - name: Run live Agentic RAG smoke tests
        if: steps.preflight.outputs.available == 'true'
        working-directory: backend
        run: python scripts/smoke_test_agent.py

      - name: Run live agent evaluation suite
        if: steps.preflight.outputs.available == 'true'
        working-directory: backend
        run: python scripts/evaluate_agent.py --mode live

      - name: Report missing secret blocker
        if: steps.preflight.outputs.available != 'true'
        run: |
          echo "Live validation was not executed because GROQ_API_KEY is not configured as a repository secret."
          echo "Automated offline gates remain separate from this live runtime gate."
